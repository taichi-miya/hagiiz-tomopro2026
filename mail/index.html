<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HagiiZ メール作成ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>:root{--pink:#e24f93;--pink-dark:#c73a7b;--pink-mid:#ef82b1;--pink-light:#f9c9dd;--pink-bg:#fdeef5;--yellow:#ffd166;--ink:#1f3864;--ink-sub:#5a6b80;--line:#06c755;--white:#fff;
  --shadow:0 14px 36px rgba(226,79,147,.18);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--pink);color:var(--ink);font-family:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",sans-serif;font-weight:500;letter-spacing:.04em;line-height:1.7;overflow-x:hidden}
.hero{padding:32px 16px 8px;color:var(--white);max-width:880px;margin:0 auto}
.hero h1{font-size:28px;font-weight:700;margin:0 0 8px}
.hero .lead{margin:0;font-size:15px}
main{max-width:880px;margin:0 auto;padding:8px 16px 48px;display:grid;gap:20px}
.card{background:var(--white);border-radius:32px;padding:24px 20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:20px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:10px}
.num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--yellow);color:var(--ink);font-size:16px}
label{display:block;font-size:14px;color:var(--ink-sub);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--white);border:2px solid var(--pink-light);border-radius:16px;padding:8px 12px;letter-spacing:.02em}
input[type="checkbox"]{width:auto;border:0;padding:0}
input:focus,select:focus,textarea:focus{outline:3px solid var(--pink-light);border-color:var(--pink)}
textarea{min-height:120px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--pink);color:var(--white);text-decoration:none}
.btn:hover{background:var(--pink-dark)}
.btn.sub{background:var(--pink-bg);color:var(--pink-dark)}
.btn.line{background:var(--line)}
.btn[disabled]{background:#d9dde5;color:#7a8699;cursor:not-allowed}
.btn.done{background:var(--pink-light);color:var(--pink-dark)}
.btn.status{background:var(--white);color:var(--ink-sub);border:2px dashed var(--pink-mid);padding:8px 16px}
.btn.status:hover{background:var(--pink-bg);color:var(--ink)}
.btn.status.on{background:var(--ink);color:var(--white);border:2px solid var(--ink)}
.btn.status.line-status.on{background:var(--line);border-color:var(--line)}
.btn.status.on:hover{filter:brightness(1.12)}
.person .btn.sub{background:var(--white)}
.person.is-mail-done{box-shadow:inset 8px 0 0 var(--ink)}
.person.is-line-done{box-shadow:inset 8px 0 0 var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hint{font-size:13px;color:var(--ink-sub);margin:6px 0 0}
.cc{font-size:13px;color:var(--ink-sub);word-break:break-all}
.person{background:var(--pink-bg);border-radius:24px;padding:16px;margin:12px 0}
.person h3{margin:0 0 4px;font-size:17px;font-weight:700}
.person .meta{font-size:13px;color:var(--ink-sub);word-break:break-all}
.preview{white-space:pre-wrap;background:var(--white);border-radius:16px;padding:12px 14px;font-size:14px;margin-top:10px;word-break:break-word}
.err{color:#b3261e;font-size:13px;margin:6px 0 0}
.warn{color:#8a5a00;background:#fff4d6;border-radius:12px;padding:4px 10px;font-size:13px;margin:6px 0 0;display:inline-block}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.1em;background:var(--yellow);color:var(--ink)}
.report{font-size:24px;font-weight:700;color:var(--pink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--white);border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
details summary{cursor:pointer;color:var(--pink-dark);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--pink-bg);border-radius:999px;padding:4px;width:max-content;max-width:100%}
.seg-btn{border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;background:transparent;color:var(--pink-dark)}
.seg-btn.on{background:var(--pink);color:var(--white)}
.bulk{background:var(--pink-bg);border-radius:24px;padding:16px;margin:12px 0}
.radio{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;margin:8px 0}
.radio input{width:auto}
.guide-sum{background:var(--white);border-radius:16px;padding:10px 14px;margin:0 0 12px}
.guide{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.guide .step{background:var(--white);border-radius:20px;padding:12px 14px;border:2px solid var(--pink-light)}
.guide .step.ok{border-color:var(--ink);opacity:.75}
.guide h4{margin:0 0 4px;font-size:16px}
.guide p{margin:6px 0;font-size:14px}
.chk{float:right;display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--ink)}
.chk input{width:auto}
.shot{display:block;max-width:100%;border-radius:12px;margin-top:8px;box-shadow:var(--shadow)}
@media (max-width:480px){.hero h1{font-size:22px}.card{padding:20px 16px;border-radius:28px}}
</style>
</head>
<body>
<header class="hero">
  <h1>HagiiZ メール作成ツール</h1>
  <p class="lead">知り合いに、1通ずつ宛名入りのご案内メールを送るためのツールです。<br>入力した内容はこのブラウザの中だけに保存され、外には送られません。</p>
</header>
<main>
  <section class="card" id="step-setup"><h2><span class="num">0</span>最初の設定</h2><div id="setup"></div></section>
  <section class="card" id="step-contacts"><h2><span class="num">1</span>宛先</h2><div id="contacts"></div></section>
  <section class="card" id="step-send"><h2><span class="num">2</span>本文を見て送る</h2><div id="mode"></div><div id="bulk"></div><div id="send"></div></section>
  <section class="card" id="step-report"><h2><span class="num">3</span>報告</h2><div id="report"></div></section>
  <section class="card" id="step-data"><h2>データ</h2><div id="data"></div></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

// 画面から独立した純粋関数。Node でテストする
(function (root) {
  // 全員共通のCC。メンバーごとの印は付けない（監視されている感じを出さないため）
  function buildCc(campaign) {
    return `${campaign.ccLocal}+${campaign.ccTag}@${campaign.ccDomain}`;
  }

  function buildGmailUrl({ account, to, cc, subject, body }) {
    const params = [
      ['authuser', account], ['view', 'cm'], ['fs', '1'], ['to', to],
    ];
    if (cc) params.push(['cc', cc]);
    params.push(['su', subject], ['body', body]);
    const qs = params.map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
    return `https://mail.google.com/mail/?${qs}`;
  }

  function surnameOf(name) {
    const s = String(name || '').trim();
    const parts = s.split(/[\s\u3000]+/);
    return parts.length > 1 ? parts[0] : s;
  }

  // constructor や __proto__ のような継承プロパティを種類とみなさない
  function hasKind(kinds, kind) {
    return typeof kind === 'string' && Object.prototype.hasOwnProperty.call(kinds, kind);
  }

  function suggestSalutation(name, kind, kinds) {
    const base = surnameOf(name);
    if (!base || !hasKind(kinds, kind)) return '';
    return base + kinds[kind].honorific;
  }

  function univPrefix(profile) {
    return profile.status === 'doctor' ? '東北大学大学院' : '東北大学';
  }

  function defaultSignature(profile) {
    return [
      '--',
      profile.name,
      `${univPrefix(profile)} ${profile.affiliation}`,
      'サイエンスイベント同好会HagiiZ',
      profile.account,
    ].join('\n');
  }

  function fill(text, vars) {
    return text.replace(/\{([^}]+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  }

  function varsFor(campaign, profile, contact) {
    return {
      宛名: contact.salutation || '',
      冒頭: contact.opening || '',
      名前: profile.name || '',
      名乗り: `${univPrefix(profile)}${profile.affiliation}の${profile.name}です。`,
      署名: profile.signature || defaultSignature(profile),
      URL: campaign.url, タイトル: campaign.title, 期間: campaign.period,
      目標: campaign.goal, 使いみち: campaign.uses, 例: campaign.example, LINE: campaign.line, キット: campaign.kit,
    };
  }

  function composeMail(campaign, templates, kinds, profile, contact) {
    if (!hasKind(templates, contact.kind)) throw new Error('相手の種類が不正です');
    const t = templates[contact.kind];
    const vars = varsFor(campaign, profile, contact);
    let body = contact.customBody || fill(t.body, vars);
    if (!contact.customBody) body = body.replace(/\n{3,}/g, '\n\n');
    return {
      to: String(contact.email || '').trim(),
      cc: contact.ccOff ? '' : buildCc(campaign),
      subject: fill(t.subject, vars),
      body,
    };
  }

  function buildLineText(campaign, templates, kinds, profile, contact) {
    if (!hasKind(kinds, contact.kind) || !hasKind(templates, contact.kind)) return '';
    const k = kinds[contact.kind];
    const t = templates[contact.kind];
    if (!k.line || !t.line) return '';
    return fill(t.line, varsFor(campaign, profile, contact));
  }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const PLACEHOLDER_RE = /○○|〇〇|要確認/;
  const CIRCLES_RE = /○○|〇〇/;
  const CUSTOM_BODY_WARNING = '本文を手で直しています。宛名・冒頭の変更は反映されません（「テンプレートに戻す」で反映）';
  const normEmail = (e) => String(e || '').trim().toLowerCase();

  function validateProfile(profile) {
    const errs = [];
    if (!String(profile.name || '').trim()) errs.push('最初の設定で名前を入れてください');
    if (!String(profile.affiliation || '').trim()) errs.push('最初の設定で所属を入れてください');
    if (!EMAIL_RE.test(String(profile.account || '').trim())) errs.push('送信に使うメールアドレスを入れてください');
    return errs;
  }

  function validateContact(campaign, templates, kinds, profile, contact, allContacts) {
    const errors = [], warnings = [];
    if (validateProfile(profile).length) errors.push('最初の設定に不足があります');
    const sal = String(contact.salutation || '').trim();
    if (!sal || PLACEHOLDER_RE.test(sal)) errors.push('宛名を入れてください（「○○」のままでは開けません）');
    if (!EMAIL_RE.test(String(contact.email || '').trim())) errors.push('メールアドレスを確認してください');
    if (!hasKind(kinds, contact.kind) || !hasKind(templates, contact.kind)) errors.push('相手の種類を選んでください');
    // 手直し本文があるときは冒頭は本文に入らないので、本文側の検査に任せる
    if (!contact.customBody && CIRCLES_RE.test(String(contact.opening || ''))) {
      errors.push('冒頭の一言の「〇〇」を書きかえてください（そのままでは開けません）');
    }
    const me = normEmail(contact.email);
    if (me && allContacts.some(o => o.id !== contact.id && normEmail(o.email) === me)) {
      warnings.push('同じアドレスが別の行にもあります（重複）');
    }
    if (contact.customBody) warnings.push(CUSTOM_BODY_WARNING);
    if (!errors.length) {
      const m = composeMail(campaign, templates, kinds, profile, contact);
      if (CIRCLES_RE.test(m.body)) errors.push('本文に「〇〇」が残っています（書きかえるまで開けません）');
      if (!m.body.includes(campaign.url)) warnings.push('本文にプロジェクトのURLが入っていません');
      if (m.body.includes('要確認')) warnings.push('本文に「要確認」が残っています');
    }
    return { errors, warnings };
  }

  let seq = 0;
  function parsePasted(text, defaultKind) {
    const out = [];
    for (const raw of String(text || '').split(/\r?\n/)) {
      const cells = raw.split(/\t|,/).map(c => c.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '')).filter(Boolean);
      if (!cells.length) continue;
      const emailIdx = cells.findIndex(c => EMAIL_RE.test(c));
      const email = emailIdx >= 0 ? cells[emailIdx] : '';
      const rest = cells.filter((_, i) => i !== emailIdx);
      const name = rest[0] || '';
      if (!email && /^(名前|氏名|name)$/i.test(name)) continue;
      if (!email && rest.some(c => /^(メール|mail|e-?mail)$/i.test(c))) continue;
      out.push({ id: `c${++seq}-${Date.now()}`, name, salutation: '', email, kind: defaultKind,
                 opening: '', customBody: '', ccOff: false, sent: false, lineSent: false });
    }
    return out;
  }

  function buildReport(contacts) {
    const mail = contacts.filter(c => c.sent).length;
    const line = contacts.filter(c => c.lineSent).length;
    return `メール${mail}通／LINE${line}人`;
  }

  const api = { CUSTOM_BODY_WARNING, hasKind, buildCc, buildGmailUrl, suggestSalutation, defaultSignature, composeMail, buildLineText, validateProfile, validateContact, parsePasted, buildReport };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.MailCore = api;
})(this);

(function (root) {

  }

    const recipients = items.length ? base + 1 : 0; // +1 は結果を知らせる自分宛メール

  function gasTargets(core, campaign, templates, kinds, profile, contacts) {
    const items = [], duplicates = [], dupIds = [], seen = new Set();
    for (const c of contacts) {
      if (c.sent) continue;
      const v = core.validateContact(campaign, templates, kinds, profile, c, contacts);
      if (v.errors.length) continue;
      const m = core.composeMail(campaign, templates, kinds, profile, c);

const LIMIT_MS_ = 4 * 60 * 1000; // GAS は1回6分で止められるので、4分で区切る

function 送信の処理(e) {
  const start = Date.now();
  checkAccount_();
  if (DATA.mode === 'schedule' && Date.now() < new Date(DATA.sendAt).getTime() - 60 * 1000) {
    Logger.log('予約の時刻（' + DATA.sendAtLabel + '）より前なので、何もしません。');

function checkAccount_() {
  const me = String(Session.getEffectiveUser().getEmail() || Session.getActiveUser().getEmail() || '').toLowerCase();
  if (me !== DATA.account.toLowerCase()) {
    throw new Error('このスクリプトは ' + (me || '（アカウント不明）') + ' で動いています。' + DATA.account + ' でログインしたGoogleアカウントで開き直してください。');
  }
}

// 同時に2つ動くと記録が食い違うので、1つずつ（このプロジェクトの中だけ。別のプロジェクトとの二重送りは mailedTo_ で防ぐ）
function withLock_(fn) {
  const lock = LockService.getScriptLock();
  if (!lock.tryLock(1000)) {
    Logger.log('いま別の処理が動いています。少し待ってから、もう一度実行してください。');
    return false;
  }
  try { fn(); } finally { lock.releaseLock(); }
  return true;
}

function keyOf_(s) {
  return (String(s || '').toLowerCase().match(/[a-z0-9._%+\-]+@[a-z0-9.\-]+/g) || []).sort().join(',');
}

function draftPrefix_() { return 'd:' + DATA.createdAt + ':'; }
function draftKey_(it) { return draftPrefix_() + it.id; }
function sentKey_(it) { return 's:' + DATA.mark + ':' + keyOf_(it.to.join(',')); } // 別のご案内に使い回しても取り違えない
function countDrafted_(all) { return DATA.items.filter(function (it) { return all[draftKey_(it)]; }).length; }

function mailedTo_() {
  const me = DATA.account.toLowerCase();
  const seen = {};
  const q = 'in:sent "' + DATA.mark + '" newer_than:120d';
  for (let start = 0; ; start += 500) {
    const threads = GmailApp.search(q, start, 500);
    for (const t of threads) {
      for (const m of t.getMessages()) {
        if (String(m.getFrom() || '').toLowerCase().indexOf(me) < 0) continue;
        if (m.getPlainBody().indexOf(DATA.mark) < 0) continue;
        for (const a of keyOf_(m.getTo()).split(',')) if (a) seen[a] = true;
      }
    }
    if (threads.length < 500) break;
  }
  return seen;
}

function plan_() {
  const found = {};
  for (const d of GmailApp.getDrafts()) {
    const m = d.getMessage();
    const body = m.getPlainBody();
    if (body.indexOf(DATA.mark) < 0) continue;
    const k = keyOf_(m.getTo());
    (found[k] = found[k] || []).push({ draft: d, date: m.getDate(), body: body });
  }
  const all = PropertiesService.getScriptProperties().getProperties();
  const mailed = mailedTo_();
  const p = { send: [], dup: [], missing: [], notYet: [], hold: [], already: [] };
  for (const it of DATA.items) {
    const who = it.to.join(',');
    const k = keyOf_(who);
    if (all[sentKey_(it)] || k.split(',').every(function (a) { return mailed[a]; })) { p.already.push(who); continue; }
    const list = (found[k] || []).sort(function (a, b) { return b.date - a.date; });
    if (!list.length) { (all[draftKey_(it)] ? p.missing : p.notYet).push(who); continue; }
    if (list.length > 1) p.dup.push(who + '（' + list.length + '通 → いちばん新しい1通だけ送ります）');
    if (/○○|〇〇/.test(list[0].body)) { p.hold.push(who + '（本文に「〇〇」が残っています）'); continue; }
    p.send.push({ item: it, draft: list[0].draft });
  }
  const base = p.send.reduce(function (n, x) { return n + x.item.to.length + (x.item.cc ? 1 : 0); }, 0);
  p.need = p.send.length ? base + 1 : 0;
  p.remaining = MailApp.getRemainingDailyQuota();

function indent_(list) { return list.map(function (s) { return '  ' + s; }); }

function report_(p) {
  const lines = ['送る予定：' + p.send.length + '通'];
  if (p.already.length) lines.push('すでに送っています（今回は送らない）：' + p.already.length + '人');
  if (p.dup.length) lines.push('同じ宛先に下書きが複数：', ...indent_(p.dup));
  if (p.notYet.length) lines.push('まだ下書きがない：' + p.notYet.length + '人 →「手順1_下書きを作る」を実行してください');
  if (p.missing.length) lines.push('下書きが見つからない（下書きを消したか、Gmailから自分で送った人です。送るなら、ツールの「1通ずつ」で）：', ...indent_(p.missing));
  if (p.hold.length) lines.push('送らない（書きかえが必要）：', ...indent_(p.hold));
  lines.push('今日あと送れる宛先の数：' + p.remaining + '（今回使う数：' + p.need + '）');
  if (p.need > p.remaining) lines.push('今日の上限を超えます。宛先を減らしてツールで作り直すか、明日以降に送ってください。');
  lines.push(DATA.mode === 'schedule'

function sendAll_(start, viaTrigger) {
  const p = plan_();
  if (!p.send.length) {
    finishTriggers_();
    return finish_(p, 0, [], '送るものがありません', viaTrigger);
  }
  if (p.need > p.remaining) {
    finishTriggers_();
    const why = p.already.length
      ? '今日送れる数が足りないので、ここで止めました（ここまでに ' + p.already.length + ' 人に送っています）'
      : '今日送れる数が足りないので、1通も送りませんでした';
    return finish_(p, 0, [], why, viaTrigger);
  }
  const props = PropertiesService.getScriptProperties();
  const errors = [];
  let now = 0;
  for (const x of p.send) {
    const who = x.item.to.join(',');
    if (Date.now() - start > LIMIT_MS_) {
      finishTriggers_();
      ScriptApp.newTrigger('送信の処理').timeBased().after(60 * 1000).create();
      Logger.log('時間切れが近いので、1分後に続きを送ります（今回 ' + now + ' 通）。');
      return;
    }
    try {
      x.draft.send();
    } catch (e) {
      errors.push(who + '：' + e);
      continue;
    }
    now++;
    // 送れたあとの記録の失敗は「送れなかった」に数えない（送信済みフォルダでも二度送りは防げる）
    try { props.setProperty(sentKey_(x.item), '1'); } catch (e) { Logger.log('送信の記録を残せませんでした（送信はできています）：' + who); }
  }
  finishTriggers_();
  finish_(p, now, errors, '', true);
}

  const KEY = 'hagiiz-mail-tool-v1';

  function emptyBulk() { return { on: false, when: 'now', date: '', time: '09:00', run: null }; }

  function emptyState() {
    return { version: 1, profile: { name: '', romaji: '', status: 'undergrad', affiliation: '', account: '', signature: '' }, contacts: [], bulk: emptyBulk() };
  }

  function coerce(obj) {
    if (!obj || typeof obj !== 'object' || obj.version !== 1 || !Array.isArray(obj.contacts) || typeof obj.profile !== 'object') return null;
    const base = emptyState();
    const bulk = (obj.bulk && typeof obj.bulk === 'object') ? { ...emptyBulk(), ...obj.bulk } : emptyBulk();
    return { version: 1, profile: { ...base.profile, ...obj.profile }, contacts: obj.contacts, bulk };
  }

  function load(storage) {
    try {
      const raw = storage.getItem(KEY);
      if (!raw) return emptyState();
      return coerce(JSON.parse(raw)) || emptyState();
    } catch (e) {
      return emptyState();
    }
  }

  function save(storage, state) {
    try { storage.setItem(KEY, JSON.stringify(state)); return true; } catch (e) { return false; }
  }

  function clear(storage) {
    try { storage.removeItem(KEY); return true; } catch (e) { return false; }
  }

  function exportJson(state) { return JSON.stringify(state, null, 1); }

  function importJson(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { throw new Error('読み込めないファイルです'); }
    const s = coerce(obj);
    if (!s) throw new Error('読み込めないファイルです');
    return s;
  }

    const v = Core.validateContact(CAMPAIGN, TEMPLATES, KINDS, state.profile, c, state.contacts);
    // preview は表示用（エラーがあっても本文は見せて直せるようにする）。m は送ってよいときだけ
    const preview = hasKind(c.kind) ? Core.composeMail(CAMPAIGN, TEMPLATES, KINDS, state.profile, c) : null;
    const m = (preview && !v.errors.length) ? preview : null;
    return { v, m, preview };
  }

  // 入力欄はそのままにして、検査結果・件名・本文・ボタンの状態だけを書きかえる
  function refreshCard(el, c) {
    const { v, preview } = composeFor(c);
    el.classList.toggle('is-mail-done', !!c.sent);
    el.classList.toggle('is-line-done', !!c.lineSent && !c.sent);
    el.querySelector('[data-part="title"]').innerHTML = `${esc(c.name || '（名前未入力）')} ${c.sent ? '<span class="tag">送信済み</span>' : ''} ${c.lineSent ? '<span class="tag">LINE済み</span>' : ''}`;
    el.querySelector('[data-part="msgs"]').innerHTML =
      v.errors.map(e => `<p class="err">${esc(e)}</p>`).join('') + v.warnings.map(e => `<p class="warn">${esc(e)}</p>`).join('');
    const comp = el.querySelector('[data-part="compose"]');
    comp.hidden = !preview;
    if (preview) {
      el.querySelector('[data-part="meta"]').innerHTML = `件名：${esc(preview.subject)}<br>CC：${esc(preview.cc || 'なし')}`;
      const ta = el.querySelector('[data-f="customBody"]');
      if (document.activeElement !== ta && ta.value !== preview.body) ta.value = preview.body;
    }
    const open = el.querySelector('[data-act="open"]');
    const inRun = inBulkRun(c);
    open.disabled = v.errors.length > 0 || inRun;
    open.classList.toggle('done', !!c.sent);
    open.textContent = inRun ? 'まとめて送る途中です（GASで送ります）' : c.sent ? 'もう一度Gmailで開く' : 'Gmailで開く';
    const line = el.querySelector('[data-act="line"]');
    if (line) line.disabled = !!(v.errors.length && !c.salutation);
  }

  // まとめて送るスクリプトの対象で、まだ印が付いていない人は1通ずつでは開かせない（手作業とGASで二度送らないため）
  function inBulkRun(c) {
    const run = state.bulk && state.bulk.run;
    return !!(run && !c.sent && run.ids.includes(c.id));
  }

  function refreshAllCards() {
    document.querySelectorAll('#send .person').forEach(el => {
      const c = state.contacts.find(x => x.id === el.dataset.id);
      if (c) refreshCard(el, c);
    });
  }

  function refreshDerived() { refreshSetup(); refreshAllCards(); refreshBulk(); }

  // 入力欄1つ分の値を c に入れる。値が変わっていなければ何もしない
  function applyField(el, c, inp) {
    const f = inp.dataset.f;
    if (f === 'ccOff') { c.ccOff = inp.checked; return; }
    if (f === 'customBody') {
      if (el.querySelector('[data-part="compose"]').hidden) return;
      const fresh = hasKind(c.kind) ? Core.composeMail(CAMPAIGN, TEMPLATES, KINDS, state.profile, { ...c, customBody: '' }).body : null;
      c.customBody = (fresh !== null && inp.value === fresh) ? '' : inp.value;
      return;
    }
    if (c[f] === inp.value) return;
    c[f] = inp.value;
    if ((f === 'name' || f === 'kind') && !c.salutationTouched) {
      c.salutation = Core.suggestSalutation(c.name, c.kind, KINDS);
      el.querySelector('[data-f="salutation"]').value = c.salutation;
    }
    if (f === 'salutation') c.salutationTouched = true;
  }

  function syncCard(el, c) {
    el.querySelectorAll('input[data-f], textarea[data-f]').forEach(inp => applyField(el, c, inp));
  }

  function renderSend() {
    const wrap = $('send');
    if (!state.contacts.length) { wrap.innerHTML = '<p class="hint">「1. 宛先」で相手を追加すると、ここに1通ずつ表示されます。</p>'; return; }
    wrap.innerHTML = state.contacts.map(cardSkeleton).join('');

    wrap.querySelectorAll('.person').forEach(el => {
      const c = state.contacts.find(x => x.id === el.dataset.id);
      if (!c) return;
      el.querySelectorAll('input[data-f], textarea[data-f]').forEach(inp => {
        const ev = inp.type === 'checkbox' ? 'change' : 'input';
        inp.addEventListener(ev, () => { applyField(el, c, inp); persist(); refreshAllCards(); refreshBulk(); });
      });
      // 種類が変わるとボタンや例文が変わるので、ここだけは作り直す
      el.querySelector('select[data-f="kind"]').addEventListener('change', (ev) => {
        applyField(el, c, ev.target); persist(); renderAll();
      });
      el.querySelectorAll('[data-act]').forEach(btn => btn.addEventListener('click', async () => {
        const act = btn.dataset.act;
        syncCard(el, c);
        if (act === 'open') {
          if (inBulkRun(c)) { toast('この人はまとめて（GAS）で送る途中です'); return; }
          const { v, m } = composeFor(c);
          if (!m) { persist(); refreshAllCards(); toast(v.errors[0] || '開けません'); return; }
          const copied = copy(m.body);
          window.open(Core.buildGmailUrl({ account: state.profile.account.trim(), ...m }), '_blank', 'noopener');
          persist();
          await copied;
          toast('Gmailを開きました。本文が空なら貼り付け（Ctrl+V）してください。送ったら「メール 未送信」を押して「送信済み」にしてください');
        } else if (act === 'line') {
          if (!hasKind(c.kind)) return;
          persist();
          const ok = await copy(Core.buildLineText(CAMPAIGN, TEMPLATES, KINDS, state.profile, c));
          toast(ok ? 'LINE用の文をコピーしました' : 'コピーできませんでした');
        } else if (act === 'sent') { c.sent = !c.sent; persist(); renderAll(); }
        else if (act === 'lineSent') { c.lineSent = !c.lineSent; persist(); renderAll(); }
        else if (act === 'reset') { c.customBody = ''; persist(); renderAll(); }
        else if (act === 'del') {
          if (confirm(`${c.name || 'この行'}を削除しますか？`)) { state.contacts = state.contacts.filter(x => x.id !== c.id); persist(); renderAll(); }
        }
      }));
      refreshCard(el, c);
    });
    bindDetailsToggle(wrap);
  }

  // ---- 送り方の切り替え
  function renderMode() {
    const on = state.bulk.on;
    $('mode').innerHTML = `<div class="seg" role="group" aria-label="送り方">
        <button class="seg-btn${on ? '' : ' on'}" data-mode="single" aria-pressed="${on ? 'false' : 'true'}">1通ずつ（Gmailで開く）</button>
        <button class="seg-btn${on ? ' on' : ''}" data-mode="bulk" aria-pressed="${on ? 'true' : 'false'}">まとめて（GAS）</button>
      </div>
      <p class="hint">${on ? '宛先が多いときの方法です。下書きをまとめて作り、Gmailで確かめてから、今すぐ／予約で送ります。' : '1通ずつ本文を確かめて送る方法です。'}</p>`;
    $('mode').querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => {
      state.bulk.on = btn.dataset.mode === 'bulk'; persist(); renderAll();
    }));
  }

  function localYmd(d) {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  // ---- まとめて送る欄（スクリプトを作る前）
  function renderBulk() {
    const box = $('bulk');
    const b = state.bulk;
    if (!b.on) { box.innerHTML = ''; return; }
    if (b.run) { renderGuide(box, b.run); return; }
    box.innerHTML = `<div class="bulk">
        <div id="b-summary"></div>
        <label class="radio"><input type="radio" name="b-when" value="now"${b.when === 'now' ? ' checked' : ''}> 今すぐ送る</label>
        <label class="radio"><input type="radio" name="b-when" value="schedule"${b.when === 'schedule' ? ' checked' : ''}> 日時を指定して予約する</label>
        <div class="row" id="b-at"${b.when === 'schedule' ? '' : ' hidden'}>
          <div><label for="b-date">日付</label><input type="date" id="b-date" min="${localYmd(new Date())}" value="${esc(b.date)}"></div>
          <div><label for="b-time">時刻（日本時間）</label><input type="time" id="b-time" value="${esc(b.time)}"></div>
        </div>
        <div id="b-errs"></div>
        <div class="btns"><button class="btn" id="b-make">スクリプトを作る</button></div>
      </div>`;
    box.querySelectorAll('input[name="b-when"]').forEach(r => r.addEventListener('change', () => {
      b.when = r.value; persist(); $('b-at').hidden = b.when !== 'schedule'; refreshBulk();
    }));
    $('b-date').addEventListener('input', (ev) => { b.date = ev.target.value; persist(); refreshBulk(); });
    $('b-time').addEventListener('input', (ev) => { b.time = ev.target.value; persist(); refreshBulk(); });
    $('b-make').addEventListener('click', () => {
      const s = bulkStatus();
      if (s.errors.length) { toast(s.errors[0]); return; }
      const schedule = b.when === 'schedule'
        ? { mode: 'schedule', sendAt: Gas.sendAtIso(b.date, b.time), label: Gas.sendAtLabel(b.date, b.time) }
        : { mode: 'now' };
      const createdAt = new Date().toISOString();
      b.run = {
        // 同じアドレスで外した行にも印を付けないと、次回の対象に入って同じ人にもう1通送ってしまう
        ids: s.items.map(i => i.id).concat(s.dupIds), account: state.profile.account.trim(), mode: schedule.mode, sendAt: schedule.sendAt || '', label: schedule.label || '',
        createdAt, count: s.items.length, script: Gas.buildGasScript(CAMPAIGN, state.profile, s.items, schedule, createdAt), checks: {},
      };
      persist(); renderAll();
      toast('スクリプトを作りました。下の手順の順に進めてください');
    });
    refreshBulk();
  }

  function bulkStatus() {
    const { items, duplicates, dupIds } = Gas.gasTargets(Core, CAMPAIGN, TEMPLATES, KINDS, state.profile, state.contacts);
    const q = Gas.quotaEstimate(items, state.profile.account);
    const errors = [];
    if (Core.validateProfile(state.profile).length) errors.push('最初の設定に不足があります');
    if (!items.length) errors.push('まとめて送れる宛先がありません（エラーのある人・送信済みの人は対象外です）');
    if (!q.fits) errors.push(`1日に送れる数（${q.limit}）を超えます。宛先を${q.days}日に分けて送ってください（今日送らない人は、書き出してから削除するなど）`);
    if (state.bulk.when === 'schedule') {
      const e = Gas.scheduleError(state.bulk.date, state.bulk.time, new Date());
      if (e) errors.push(e);
    }
    return { items, duplicates, dupIds, q, errors };
  }

  // 入力欄は作り直さず、数と注意とボタンだけ書きかえる
  function refreshBulk() {
    if (!state.bulk.on || state.bulk.run || !$('b-summary')) return;
    const s = bulkStatus();
    $('b-summary').innerHTML = `<p><b>まとめて送る対象：${s.items.length}人</b>（エラーがなく、まだ「メール送信済み」でない人）</p>
      ${s.duplicates.length ? `<p class="warn">同じアドレスが別の行にもあるため、2人目以降を外しました：${esc(s.duplicates.join('、'))}</p>` : ''}
      <p class="hint">使う宛先の数：${s.q.recipients}（To と CC を1人ずつ数えます。1日の上限は${s.q.consumer ? '個人のGmailで' : ''} ${s.q.limit}）</p>
      ${s.q.consumer ? '<p class="warn">個人のGmailで送る設定です。大学のメールアドレスを強く推奨します（上限が約15倍）。最初の設定で変えられます。</p>' : ''}`;
    $('b-errs').innerHTML = s.errors.map(e => `<p class="err">${esc(e)}</p>`).join('');
    $('b-make').disabled = s.errors.length > 0;
  }

  // ---- 手順の案内（スクリプトを作った後）
  function renderGuide(box, run) {
    const steps = Gas.gasGuide(state.profile, run);
    const when = run.mode === 'schedule' ? `${esc(run.label)} に予約` : '今すぐ送る';
    box.innerHTML = `<div class="bulk">
        <p class="guide-sum"><b>${run.count}通</b>・${when}・実行するアカウント：<b>${esc(run.account || state.profile.account)}</b></p>
        <ol class="guide">${steps.map((st, i) => `
          <li class="step${run.checks[st.id] ? ' ok' : ''}" data-step="${st.id}">
            <label class="chk"><input type="checkbox" data-check="${st.id}"${run.checks[st.id] ? ' checked' : ''}> できた</label>
            <h4>${i + 1}. ${esc(st.title)}</h4>
            <p>${esc(st.text)}</p>
            ${st.link ? `<p><a class="btn sub" href="${esc(st.link)}" target="_blank" rel="noopener">${esc(st.linkLabel)}</a></p>` : ''}
            ${st.action === 'copy' ? '<p><button class="btn" data-guide="copy">スクリプトをコピー</button></p>' : ''}
            ${st.action === 'mark' ? '<p><button class="btn" data-guide="mark">まとめて送信済みにする</button></p>' : ''}
            ${(st.images || []).filter(k => ASSETS[k]).map(k => `<img class="shot" src="${ASSETS[k]}" alt="権限の確認の画面">`).join('')}
          </li>`).join('')}
        </ol>
        <div class="btns"><button class="btn sub" data-guide="redo">スクリプトを作り直す</button></div>
      </div>`;
    const check = (id, on) => {
      run.checks[id] = on; persist();
      const li = box.querySelector(`[data-step="${id}"]`);
      if (li) { li.classList.toggle('ok', on); const c = li.querySelector('[data-check]'); if (c) c.checked = on; }
    };
    box.querySelectorAll('[data-check]').forEach(c => c.addEventListener('change', () => check(c.dataset.check, c.checked)));
    box.querySelectorAll('[data-guide]').forEach(btn => btn.addEventListener('click', async () => {
      const act = btn.dataset.guide;
      if (act === 'copy') {
        const ok = await copy(run.script);
        if (ok) check('copy', true);
        toast(ok ? 'スクリプトをコピーしました。次はGASを開きます' : 'コピーできませんでした');
      } else if (act === 'mark') {
        if (!confirm(`今回の ${run.count} 人に「メール送信済み」の印を付けます。送信が終わってから押してください。よろしいですか？`)) return;
        const ids = new Set(run.ids);
        state.contacts.forEach(c => { if (ids.has(c.id)) c.sent = true; });
        run.checks.mark = true;
        persist(); renderAll();
        toast(`${run.count}人を送信済みにしました`);
      } else if (act === 'redo') {
        const cancelFirst = run.mode === 'schedule' && run.checks.send
          ? '先に、前のプロジェクトで「予約を取り消す」を実行してください（予約が残っていると、その時刻にも送られます）。\n\n' : '';
        if (!confirm(cancelFirst + '今のスクリプトを捨てて、作り直しますか？（GASに貼ったスクリプトと、作った下書きはそのまま残ります。すでに送った人には、作り直しても二度は送りません）')) return;
        state.bulk.run = null; persist(); renderAll();
      }
    }));
  }

  // ---- 3. 報告
  function renderReport() {
    const text = Core.buildReport(state.contacts);
    $('report').innerHTML = `<p class="report">${esc(text)}</p><div class="btns"><button class="btn" id="copy-report">報告文をコピー</button></div>`;
    $('copy-report').onclick = async () => toast((await copy(text)) ? 'コピーしました。グループに貼ってください' : 'コピーできませんでした');
  }

  // ---- データ
  function renderData() {
    $('data').innerHTML = `<p class="hint">入力内容はこのブラウザに自動保存されます。別のPCで続けるときや、念のための控えには「書き出し」を使ってください。</p>
      <p class="hint">共用のPCで使ったあとは『全部消す』を押してください</p>
      <div class="btns"><button class="btn sub" id="export">書き出し</button>
      <label class="btn sub" style="margin:0">読み込み<input type="file" id="import" accept="application/json" hidden></label>
      <button class="btn sub" id="wipe">全部消す</button></div>`;
    $('export').onclick = () => {
      const blob = new Blob([Store.exportJson(state)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hagiiz_mail_tool.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    $('import').onchange = async (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      ev.target.value = '';
      try {
        const next = normalizeState(Store.importJson(await f.text()));
        if (!confirm('今の宛先と送信の印を、読み込むファイルの内容で置き換えます。よろしいですか？')) return;
        state = next;
        if (state.profile.signature) openDetails.add('sign');
        persist(); renderAll(); toast('読み込みました');
      }
      catch (e) { toast(e.message); }
    };
    $('wipe').onclick = () => {
      if (confirm('設定と宛先をすべて消します。よろしいですか？（書き出したファイルは消えません）')) {
        Store.clear(store); state = normalizeState(Store.emptyState());
        pasteDraft = emptyPasteDraft(); openDetails.clear();
        renderAll();
      }
    };
  }

  function renderAll() {
    const focus = captureFocus();
    renderSetup(); renderContacts(); renderMode(); renderBulk(); renderSend(); renderReport(); renderData();
    restoreFocus(focus);
  }
  renderAll();
})();
</script>
</body>
</html>
